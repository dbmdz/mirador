image: "$BUILD_IMAGE_NODE:24"

stages:
  - publish

#######################
#### Stage publish ####
#######################

publish:
  rules:
    - if: $CI_COMMIT_TAG
      when: on_success
  script:
    - npm ci
    - npm run build
    - echo "@mdz:registry=https://$CI_SERVER_HOST/api/v4/projects/$CI_PROJECT_ID/packages/npm/" >> .npmrc
    - echo "//$CI_SERVER_HOST/api/v4/projects/$CI_PROJECT_ID/packages/npm/:_authToken=$CI_JOB_TOKEN" >> .npmrc
    - npm publish --tag latest
  stage: publish
